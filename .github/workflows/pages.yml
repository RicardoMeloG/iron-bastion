# Publica el juego en GitHub Pages en cada push a main (spec 001, T15, D-4).
# Lo copia scripts/export-public.mjs a .github/workflows/ del repositorio público.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Las comprobaciones que no necesitan Chrome: pruebas, fronteras y modelos.
      - run: npm test
      - run: npm run check:boundaries
      - run: npm run check:rigs
      - run: npm run build
        env:
          # Registro de partidas con permiso del jugador (spec 003, M1; receptor: obsidian-cube spec 015).
          VITE_REGISTRO_URL: https://ricardomelog.com/api/iron-bastion/partidas
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
